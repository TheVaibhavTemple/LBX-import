spring:
  application:
    name: lockbox-import
  profiles:
    active: local

# ================= Global Settings (All Profiles) =================
logging:
  level:
    com.bofa.ibox.lockbox: INFO
    org.springframework.jdbc: WARN

# ================= LOCAL =================
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ibox_dev?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HikariCP

lockbox:
  import:
    in-dir:        ${LOCKBOX_IN_DIR:D:\ibox\file\in}
    processed-dir: ${LOCKBOX_PROCESSED_DIR:D:\ibox\file\processed}
    error-dir:     ${LOCKBOX_ERROR_DIR:D:\ibox\file\error}
    scheduler-enabled:          ${LOCKBOX_SCHEDULER_ENABLED:true}
    scheduler-interval-ms:      ${LOCKBOX_SCHEDULER_INTERVAL_MS:10000}
    scheduler-initial-delay-ms: ${LOCKBOX_SCHEDULER_INITIAL_DELAY_MS:5000}
    modified-by: LOCKBOX_IMPORT_JOB
    batch-size:     1000
    max-lockbox-count:     50000
    max-file-age-days:     2
    staging-retention-days: 30
    db-schema: ${LOCKBOX_DB_SCHEMA:public}
    event-name: ${LOCKBOX_EVENT_NAME:emailNotificationSenderLocal}
    env: ${LOCKBOX_ENV:local}

spring:
  jms:
    servicebus:
      pricing-tier: Standard
      topic-client-id: ssssssdfef
      connection-string: "Endpoint=sb://sbecxdeveus01.servicebus.windows.net/;SharedAccessKeyName=ab-config;SharedAccessKey=XCh5/lJpBqufvlKw/Frug+n0yXKsRvfF++ASbLVkCqg="
    listener:
      acknowledge-mode: dups-ok
azure:
  servicebus:
    queue-name: sbecxdeveus01-queue-01
    topic-name: sbecxdeveus01-topic-01
    connection-string: "Endpoint=sb://sbecxdeveus01.servicebus.windows.net/;SharedAccessKeyName=ab-config;SharedAccessKey=XCh5/lJpBqufvlKw/Frug+n0yXKsRvfF++ASbLVkCqg="

